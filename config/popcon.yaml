      type: url
      value: https://salsa.debian.org/installer-team/libdebian-installer/-/archive/0.125/libdebian-installer-0.125.tar.gz?ref_type=tags
    deps:
      - check

  check:
    source:
      type: url
      value: https://github.com/libcheck/check/releases/download/0.15.2/check-0.15.2.tar.gz

  dvdread:
    source:
