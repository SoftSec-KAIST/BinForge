projects:

  base-passwd:
    options:
      - --disable-selinux
      - --disable-debconf

  bash:
    cflags:
      - -Wno-implicit-function-declaration

  debianutils:

  diffutils:
    version: 1:3.10-1build1

  dosfstools:

  file:

  less:
    deps:
      - ncurses
    cflags:
      - -Wno-error=implicit-function-declaration
    ldflags:
      - -lncursesw
      - -ltinfo

  libacl1:
    deps:
      - attr

  libasound2-data:
    cflags:
      - -fno-finite-math-only

  libasyncns0:
    options:
      - ac_cv_func_malloc_0_nonnull=yes

  libattr1:

  libavc1394-0:
    deps:
      - libraw1394

  libblkid1:
    source:
      type: apt
      value: util-linux
    options:
      - --disable-libmount
    deps:
      - ncurses
      - zlib
      - libxcrypt
    ldflags:
      - -lm
      - -lncursesw
      - -ltinfo

  libbrotli1:
    cflags:
      - -fno-finite-math-only

  libbsd0:
    deps:
      - libmd

  # libcaca0:

  libcrypt1:
    options:
      - --disable-werror

  libdatrie1:

  libdbus-1-3:
    deps:
      - libexpat

  libdebconfclient0:
    deps:
      - libdebian-installer
      - ncurses
    options:
      - NCURSES_LIBS=-lncursesw
    ldflags:
      - -ldebian-installer
      - -lncursesw
      - -ltinfo

  libdeflate0:

  libdvdnav4:
    deps:
      - dvdread

  libevdev2:
    cflags:
      - -Wno-deprecated-ofast

  libexif12:

  libexpat1:

  libfaad2:
    cflags:
      - -fno-finite-math-only

  libfftw3-double3:
    cflags:
      - -fno-finite-math-only

  libflite1:
    cflags:
      - -fno-finite-math-only
    options:
      - --enable-shared

  libfribidi0:

  libfstrm0:
    deps:
      - libevent

  libgd3:
    cflags:
      - -fno-finite-math-only
    deps:
      - zlib

  libgphoto2-l10n:
    deps:
      - libtool
      - libxml2
      - zlib
    cflags:
      - -fno-finite-math-only

  libiec61883-0:
    deps:
      - libraw1394

  libjansson4:

  libjemalloc2:

  libjxr-tools:
    cflags:
      - -Wno-implicit-function-declaration
      - -fno-finite-math-only

  liblerc4:

  liblockfile-bin:

  libltdl7:

  liblz4-1:

  liblzma5:

  liblzo2-2:
    options:
      - --enable-shared

  libmaxminddb0:

  libmd0:

  libmnl0:

  libmpc3:
    deps:
      - mpfr
      - gmp

  libmpcdec6:
    cflags:
      - -fno-finite-math-only

  libmpfr6:
    deps:
      - gmp

  libnetfilter-conntrack3:
    deps:
      - libnfnetlink
      - libmnl

  libnfnetlink0:

  libnftables1:
    deps:
      - libmnl
      - libnftnl
      - gmp
      - libedit
      - readline
      - ncurses
    ldflags:
      - -lmnl
      - -lnftnl
      - -ltinfo

  libnftnl11:
    deps:
      - libmnl

  libnghttp2-14:

  libnl-3-200:

  libnss-mdns:

  libogg0:

  libonig5:

  libopencore-amrnb0:

  libopenjp2-7:
    cflags:
      - -fno-finite-math-only

  libp11-kit0:
    deps:
      - libtasn1
      - libffi

  libpam-modules:
    options:
      - --disable-doc
    ldflags:
      - -lm
      - -latomic
    deps:
      - libxcrypt

  libpaper-utils:

  libpciaccess0:

  libpcre2-8-0:

  libpipeline1:

  libpopt0:

  libraw1394-11:

  libsamplerate0:

  libsbc1:
    deps:
      - libsndfile
    options:
      - --enable-high-precision
    ldflags:
      - -lmvec

  libseccomp2:

  libshine3:

  libshout3:
    deps:
      - libogg
    cflags:
      - -Wno-implicit-function-declaration

  libslang2:
    cflags:
      - -fno-finite-math-only
    deps:
      - zlib

  libsndfile1:
    cflags:
      - -fno-finite-math-only

  libsodium23:

  libspeex1:

  libthai-data:
    deps:
      - libdatrie
    options:
      - --disable-dict

  libtheora0:
    deps:
      - libogg
    options:
      - --disable-examples

  libtiff6:
    cflags:
      - -fno-finite-math-only

  libtirpc-common:
    options:
      - --disable-gssapi

  libtwolame0:
    cflags:
      - -fno-finite-math-only

  libuchardet0:
    ldflags:
      - -lstdc++

  libudfread0:

  libvo-amrwbenc0:

  libwavpack1:
    cflags:
      - -fno-finite-math-only

  libwebpmux3:
    cflags:
      - -fno-finite-math-only

  libxml2:
    deps:
      - zlib
    cflags:
      - -fno-finite-math-only
    options:
      - --without-python
      - --disable-maintainer-mode

  libxslt1.1:
    deps:
      - libxml2
      - zlib
      - python
    cflags:
      - -fno-finite-math-only

  libxtables12:
    deps:
      - libmnl
      - libnftnl
    cflags:
      - -fno-finite-math-only

  libxxhash0:

  libyajl2:

  libyaml-0-2:

  libzmq5:
    cflags:
      - -Wno-error
      - -Wno-deprecated-ofast
    ldflags:
      - -lstdc++

  libzvbi-common:
    cflags:
      - -fno-finite-math-only

  logrotate:
    deps:
      - popt

  nano:
    deps:
      - ncurses
    ldflags:
      - -lncursesw
      - -ltinfo

  ocl-icd-libopencl1:

  parted:
    deps:
      - libuuid
      - ncurses
      - readline
    cflags:
      - -DUUID_STR_LEN=37
    options:
      - --disable-device-mapper

  procps:
    deps:
      - ncurses
    ldflags:
      - -lncursesw
      - -ltinfo

  psmisc:
    deps:
      - ncurses
    ldflags:
      - -lncursesw
      - -ltinfo
    options:
      - ac_cv_member_struct_user_regs_struct_orig_eax=no
      - ac_cv_member_struct_user_regs_struct_orig_rax=no
      - ac_cv_member_struct_pt_regs_orig_gpr3=no
      - ac_cv_member_struct_pt_regs_uregs=no
      - ac_cv_member_struct_user_pt_regs_regs=no

  sudo:
    options:
      - "--sysconfdir='${prefix}/share/sudo/etc'"
      - --disable-tmpfiles.d

  #! ===========================================================================
  #! Deps

  # ncurses:
  #   source:
  #     type: apt
  #     value: ncurses
  #   options:
  #     - --with-shared
  #     - --disable-stripping
  #     - --enable-widec

  ncurses:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz
    options:
      - --disable-stripping
      - --with-shared
      - --with-termlib=tinfo
      - --enable-widec
      - --enable-overwrite
      - --without-debug
      - --without-normal

  attr:
    source:
      type: url
      value: https://download.savannah.gnu.org/releases/attr/attr-2.5.2.tar.gz

  libraw1394:
    source:
      type: url
      value: https://sourceforge.net/projects/libraw1394/files/libraw1394/libraw1394-2.0.5.tar.gz/download

  python:
    source:
      type: url
      value: https://code.launchpad.net/ubuntu/+archive/primary/+sourcefiles/python3.12/3.12.2-4build4/python3.12_3.12.2.orig.tar.xz
    options:
      - ac_cv_file__dev_ptmx=yes
      - ac_cv_file__dev_ptc=no
      - --with-build-python
      - --disable-ipv6
      - CURSES_LIBS=-lncursesw
      - PANEL_LIBS=-lpanelw
    deps:
      - bzip2
      - gdbm
      - libffi
      - libuuid
      - libxcrypt
      - ncurses
      - readline
      - xz
      - zlib
    ldflags:
      - -lncursesw
      - -ltinfo

  bzip2:
    version: 66c46b8c9436613fd81bc5d03f63a61933a4dcc3
    source:
      type: url_git
      value: https://gitlab.com/bzip2/bzip2
      commit: 66c46b8c9436613fd81bc5d03f63a61933a4dcc3

  gdbm:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/gdbm/gdbm-1.25.tar.gz

  libffi:
    source:
      type: url
      value: https://github.com/libffi/libffi/releases/download/v3.4.7/libffi-3.4.7.tar.gz

  libuuid:
    source:
      type: url
      value: https://sourceforge.net/projects/libuuid/files/libuuid-1.0.3.tar.gz/download
    cflags:
      - -Wno-implicit-function-declaration

  libxcrypt:
    source:
      type: url
      value: https://github.com/besser82/libxcrypt/releases/download/v4.4.38/libxcrypt-4.4.38.tar.xz

  readline:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz

  xz:
    source:
      type: url
      value: https://github.com/tukaani-project/xz/releases/download/v5.8.1/xz-5.8.1.tar.gz
    options:
      - --disable-fortran
      - --without-cfitsio
      - --without-pgplot

  libmd:
    source:
      type: url
      value: https://archive.hadrons.org/software/libmd/libmd-1.1.0.tar.xz

  libexpat:
    source:
      type: url
      value: https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.gz

  libdebian-installer:
