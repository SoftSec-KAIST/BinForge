      type: url
      value: https://github.com/libevent/libevent/releases/download/release-2.2.1-alpha/libevent-2.2.1-alpha-dev.tar.gz
    options:
      - --disable-openssl

  zlib:
    source:
      type: url
      value: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz

  libtool:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/libtool/libtool-2.5.4.tar.xz

  mpfr:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.gz
    deps:
      - gmp

  gmp:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz

  libnfnetlink:
    source:
      type: url
      value: https://www.netfilter.org/projects/libnfnetlink/files/libnfnetlink-1.0.2.tar.bz2

  libmnl:
    source:
      type: url
      value: https://www.netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2

  libnftnl:
    source:
      type: url
      value: https://www.netfilter.org/projects/libnftnl/files/libnftnl-1.2.8.tar.xz
    deps:
      - libmnl

  libedit:
    source:
      type: url
      value: https://thrysoee.dk/editline/libedit-20250104-3.1.tar.gz
    deps:
      - ncurses
    ldflags:
      - -lncursesw
      - -ltinfo

  libtasn1:
    source:
      type: url
      value: https://ftp.gnu.org/gnu/libtasn1/libtasn1-4.20.0.tar.gz

  libsndfile:
    source:
      type: url
      value: https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
    cflags:
      - -fno-finite-math-only

  libogg:
    source:
      type: url
      value: https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz

  popt:
    source:
      type: url
      value: https://github.com/rpm-software-management/popt/archive/refs/tags/popt-1.19-release.tar.gz

  libdatrie:
    source:
      type: url
      value: https://github.com/tlwg/libdatrie/releases/download/v0.2.13/libdatrie-0.2.13.tar.xz

