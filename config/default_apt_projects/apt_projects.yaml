# ------------------------------------------------------------------------------
# Default APT Projects Required for Building Toolchains and Clang
#
# This list includes essential development tools required for:
# - Building crosstool-ng itself
# - Building various cross-compiler toolchains (e.g., GCC-based)
# - Building and installing Clang from source
#
# These packages should be installed via APT before initiating any builds.
# ------------------------------------------------------------------------------

default_projects:
  - autoconf
  - autogen
  - automake
  - binutils
  - bison
  - build-essential
  - bzip2
  - cmake
  - curl
  - flex
  - g++
  - gawk
  - gcc
  - gcc-multilib
  - gettext
  - git
  - gperf
  - help2man
  - libncurses-dev
  - libstdc++6
  - libtool
  - libtool-bin
  - make
  - ninja-build
  - parallel
  - patch
  - pkg-config
  - rsync
  - tar
  - texinfo
  - unzip
  - wget
  - xz-utils
